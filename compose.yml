# Dev environment: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: harch
      POSTGRES_USER: harch
      POSTGRES_PASSWORD: harch
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harch"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    # Apply pending migrations on every start, so a `git pull` with new models never 500s.
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    command: /usr/local/bin/supercronic /app/deploy/crontab
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      TZ: Europe/Kyiv
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

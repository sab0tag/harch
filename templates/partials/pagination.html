{% if page.has_other_pages %}
<nav class="mt-3 d-flex align-items-center gap-3" aria-label="Сторінки">
  <ul class="pagination mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">‹</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">{{ page.number }} / {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">›</a></li>{% endif %}
  </ul>
  <span class="small text-secondary">Усього: {{ page.paginator.count }}</span>
</nav>
{% endif %}

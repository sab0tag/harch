<header class="harch-topbar sticky-top">
  <div class="d-flex align-items-center gap-2 px-3 py-2">
    <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Відкрити меню">
      <i class="bi bi-list"></i>
    </button>
    <div class="me-auto" style="min-width: 0">
      <div class="fw-semibold text-truncate">{{ HOSPITAL_NAME }}</div>
      <div class="small text-secondary text-truncate">Сьогодні: {% now "l, j E Y" %}</div>
    </div>
    <div class="dropdown">
      <button class="btn btn-light position-relative" type="button" data-bs-toggle="dropdown" aria-expanded="false"
              aria-label="Сповіщення" data-bs-auto-close="outside"
              hx-get="{% url 'workflow:notification_list' %}" hx-target="#notification-menu" hx-trigger="click">
        <i class="bi bi-bell"></i>
        <span id="notification-badge" hx-get="{% url 'workflow:notification_count' %}" hx-trigger="load, every 60s" hx-target="this" hx-swap="innerHTML"></span>
      </button>
      <div class="dropdown-menu dropdown-menu-end p-0 shadow" id="notification-menu" style="width: min(24rem, 92vw)">
        <div class="p-3 text-secondary small">Завантаження…</div>
      </div>
    </div>
    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle"></i>
        <span class="d-none d-sm-inline text-truncate" style="max-width: 14rem">{{ user }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><span class="dropdown-item-text small text-secondary">{{ user.get_role_display }}{% if user.department %} · {{ user.department }}{% endif %}</span></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}
            <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Вийти</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>

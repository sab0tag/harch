{% extends "base.html" %}
{% block title %}{{ item.label }}{% endblock %}
{% block content %}
  <h1 class="h3 mb-4"><i class="bi bi-{{ item.icon }} me-2"></i>{{ item.label }}</h1>
  <div class="card">
    <div class="card-body text-center py-5">
      <i class="bi bi-cone-striped fs-1 text-warning"></i>
      <p class="h5 mt-3">Розділ у розробці</p>
      <p class="text-secondary mb-0">Заплановано: {{ item.sprint }}</p>
    </div>
  </div>
{% endblock %}

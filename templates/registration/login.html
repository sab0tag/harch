{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block body %}
<main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card shadow-sm w-100" style="max-width: 400px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-egg-fried fs-1" style="color: var(--harch-accent)"></i>
        <h1 class="h4 mt-2 mb-0">Харчоблок</h1>
        <div class="small text-secondary">{{ HOSPITAL_NAME }}</div>
      </div>
      {% include "partials/messages.html" %}
      {% if form.errors %}
        <div class="alert alert-danger">Невірне ім'я користувача або пароль.</div>
      {% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Ім'я користувача</label>
          <input class="form-control form-control-lg" type="text" name="username" id="id_username"
                 autocomplete="username" autocapitalize="none" required autofocus
                 value="{{ form.username.value|default:'' }}">
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">Пароль</label>
          <input class="form-control form-control-lg" type="password" name="password" id="id_password"
                 autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-success btn-lg w-100" type="submit">Увійти</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}

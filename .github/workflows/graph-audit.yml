name: Graph audit smoke
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  graph-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile tools/graph_audit.py tests/test_graph_audit_runner.py
      - name: Test graph runner
        run: python -m unittest discover -s tests -p test_graph_audit_runner.py -v
      - name: Run graph audit smoke
        run: python tools/graph_audit.py --output graph-audit-report.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-audit-report
          path: graph-audit-report.json
          if-no-files-found: warn
          retention-days: 14

name: Graph audit smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run graph audit smoke
        run: python tools/graph_audit.py

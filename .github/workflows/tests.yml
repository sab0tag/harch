# S6-07: the full test suite on every pull request and on main.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: harch
          POSTGRES_USER: harch
          POSTGRES_PASSWORD: harch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://harch:harch@localhost:5432/harch
      TZ: Europe/Kyiv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Same system libraries as the Dockerfile: WeasyPrint needs Pango/HarfBuzz and a Cyrillic font.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: pytest
        run: pytest -n auto -p no:cacheprovider
